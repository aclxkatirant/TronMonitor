# TronMonitor ters vekil yapılandırması (Nginx).
# Kurulum betiği __DOMAIN__, __TLS_CERT__ ve __TLS_KEY__ yer tutucularını doldurur.
# Web (Next.js) 127.0.0.1:3000, API (NestJS) 127.0.0.1:4000 üzerinde yalnızca yerel olarak dinler.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Kayıt ve giriş gibi hassas uçlar için ek hız sınırı (uygulamanın kendi sınırına ek).
limit_req_zone $binary_remote_addr zone=tronmonitor_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 doğrulaması için (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:tronmonitor_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;
    access_log /var/log/nginx/tronmonitor.access.log;
    error_log  /var/log/nginx/tronmonitor.error.log;

    # Ajan ikili dosyaları (yaklaşık 8 MB) ve betikleri
    location /api/v1/agent-downloads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/v1/auth/login {
        limit_req zone=tronmonitor_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API ve WebSocket kanalları (/api/v1/ws, /api/v1/terminal, /api/v1/agents/terminal)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # terminal ve uzun yoklama bağlantıları
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Web arayüzü
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
